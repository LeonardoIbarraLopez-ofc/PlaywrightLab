<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Gestión de Tareas</h1>
    <p class="subtitle">Aplicación de ejemplo para pruebas con Playwright</p>

    <form id="task-form">
      <label for="task-input">Nueva tarea</label>
      <div class="input-row">
        <input id="task-input" name="task" type="text"
               placeholder="Escribe una tarea" autocomplete="off">
        <button id="add-task" type="submit">Agregar</button>
      </div>
      <p id="error-message" class="error" role="alert" aria-live="polite"></p>
    </form>

    <ul id="task-list" aria-label="Lista de tareas"></ul>

    <section class="summary" aria-label="Resumen">
      <span>Total: <strong id="total-count">0</strong></span>
      <span>Completadas: <strong id="completed-count">0</strong></span>
      <span>Pendientes: <strong id="pending-count">0</strong></span>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
